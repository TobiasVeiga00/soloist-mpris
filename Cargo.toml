[package]
name = "soloist-mpris"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3"
mpris-server = { version = "0.10", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs", "net"] }
tokio-tungstenite = "0.30"
