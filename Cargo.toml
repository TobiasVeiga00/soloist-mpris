[package]
name = "soloist-mpris"
version = "0.2.1"
edition = "2024"
# Oldest Rust that builds it, from the dependencies (uuid needs 1.89); CI checks it.
rust-version = "1.89"
description = "Spotify Soloist as an MPRIS player: bars, media keys and playerctl for Spotify's headless Linux player"
license = "MIT"
repository = "https://github.com/TobiasVeiga00/soloist-mpris"
readme = "README.md"
keywords = ["spotify", "mpris", "soloist", "linux", "media"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
futures-util = "0.3"
mpris-server = { version = "0.10", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs", "net", "signal"] }
tokio-tungstenite = "0.30"
