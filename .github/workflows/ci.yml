name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n install.sh packaging/soloist-update bench/measure.sh
      - name: Benchmark script smoke test
        run: |
          sleep 30 &
          bench/measure.sh '^sleep$' 5 | grep -q 'RAM (PSS)'

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --locked
