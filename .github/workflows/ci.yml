name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The toolchain is named here, not picked by the pinned ref, so moving
      # the pin to a newer commit cannot switch it.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bash -n install.sh packaging/soloist-update bench/measure.sh tests/installer.sh
      - run: shellcheck install.sh packaging/soloist-update bench/measure.sh tests/installer.sh
      - name: Installer end to end
        run: tests/installer.sh
      - name: Benchmark script smoke test
        run: |
          sleep 30 &
          bench/measure.sh '^sleep$' 5 | grep -q 'RAM (PSS)'

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
      - run: cargo test --locked
